server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança. No Nginx, um add_header dentro de "location" apaga os de fora,
    # por isso eles se repetem nos dois blocos abaixo.
    # CSP: só roda script do próprio site e do login do Google (accounts.google.com/gsi); a API, o MinIO (capas)
    # e as fontes do Google são as outras origens externas.
    set $csp "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://cell-s3.iagtp.com.br https://lh3.googleusercontent.com; media-src 'self' blob: https://backend-api.iagtp.com.br https://cell-s3.iagtp.com.br; connect-src 'self' https://backend-api.iagtp.com.br https://cell-s3.iagtp.com.br https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Arquivos do build têm hash no nome: podem ficar em cache para sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html sempre revalidado, para cada deploy chegar na hora
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # O botão do Google confere a origem do site pelo Referer; "no-referrer" quebra o login
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        try_files $uri $uri/ /index.html;
    }
}
